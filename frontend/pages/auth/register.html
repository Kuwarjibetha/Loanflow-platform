<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — LoanFlow</title>
  <meta name="description" content="Create a LoanFlow account to apply for and track loan requests.">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-logo">
        <span>L</span>
        LoanFlow
      </div>
      <div class="card">
        <h2 style="margin-bottom:4px;">Create account</h2>
        <p style="font-size:13px; color:var(--c-muted); margin-bottom:22px;">Fill in the details below to get started</p>

        <div id="error-box" class="alert alert--error" style="display:none;"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group" style="margin-bottom:22px;">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" required>
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center; padding:10px;">Create account</button>
        </form>
      </div>
      <p style="margin-top:14px; font-size:13px; color:var(--c-muted); text-align:center;">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/services/api.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/utils/dom.js"></script>
  <script src="../../js/pages/register.js"></script>
</body>
</html>
