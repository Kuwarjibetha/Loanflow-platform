<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Loan Tracking</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <div class="container" style="max-width:400px; margin-top:80px;">
    <div class="card">
      <h2 style="margin-bottom:16px;">Login</h2>
      <div id="error-box" class="badge badge--rejected" style="display:none; margin-bottom:12px;"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn--primary">Log in</button>
      </form>
      <p style="margin-top:12px; font-size:14px;">No account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/services/api.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/utils/dom.js"></script>
  <script src="../../js/pages/login.js"></script>
</body>
</html>
