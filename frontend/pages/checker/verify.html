<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Request — LoanFlow</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    
    .btn--valid   { color: var(--c-green) !important; }
    .btn--invalid { color: var(--c-red)   !important; }
  </style>
</head>
<body>
  <div id="navbar-slot"></div>
  <div class="container">
    <div class="page-header">
      <h2>Verify Request</h2>
      <a href="queue.html" class="btn btn--outline">← Queue</a>
    </div>

    <!-- Loan summary + document rows injected here -->
    <div id="request-detail"></div>

    <!-- Checker forward / return decision -->
    <div class="card" style="margin-top:16px;">
      <p class="section-label" style="margin-bottom:14px;">Checker Decision</p>
      <div class="form-group">
        <label for="remarks">Remarks</label>
        <textarea id="remarks" rows="3" placeholder="e.g. All documents verified and look correct"></textarea>
      </div>
      <div class="action-row">
        <button id="forward-btn" class="btn btn--primary">Forward to Approver</button>
        <button id="return-btn" class="btn btn--danger">Return to User</button>
      </div>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/services/api.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/services/requestService.js"></script>
  <script src="../../js/utils/auth-guard.js"></script>
  <script src="../../js/utils/dom.js"></script>
  <script src="../../js/pages/checker-verify.js"></script>
</body>
</html>
