<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Loan Request — LoanFlow</title>
  <meta name="description" content="Submit a new loan request on LoanFlow.">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <div id="navbar-slot"></div>
  <div class="container" style="max-width:540px;">
    <div class="page-header">
      <h2>New Loan Request</h2>
      <a href="dashboard.html" class="btn btn--outline">← Back</a>
    </div>

    <div id="error-box" class="alert alert--error" style="display:none;"></div>

    <div class="card">
      <form id="submit-form">
        <div class="form-group">
          <label for="loanType">Loan Category &amp; Purpose</label>
          <select id="loanType" required>
            <optgroup label="Student &amp; Academic">
              <option value="education">Higher Education / Tuition Loan</option>
              <option value="student_laptop">Laptop &amp; Tech Equipment Loan</option>
              <option value="skill">Skill &amp; Certification Course</option>
              <option value="study_abroad">Study Abroad &amp; Travel Loan</option>
            </optgroup>
            <optgroup label="Personal &amp; Emergency">
              <option value="home_repair">Home Repair &amp; Renovation</option>
              <option value="medical">Medical &amp; Healthcare Emergency</option>
              <option value="personal">Personal Emergency Loan</option>
            </optgroup>
            <optgroup label="Business &amp; Vehicle">
              <option value="small_business">Small Business Startup Loan</option>
              <option value="vehicle">Two-Wheeler / Vehicle Loan</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label for="amountRequested">Amount Requested (₹)</label>
          <input type="number" id="amountRequested" placeholder="e.g. 50000" min="1000" required>
        </div>

        <div class="divider"></div>
        <p class="section-label">Document Upload (optional)</p>

        <div class="form-group">
          <label for="docType">Document Type</label>
          <select id="docType">
            <optgroup label="Student &amp; Academic">
              <option value="student_id">College / Student ID Card</option>
              <option value="admission_letter">University Admission Letter / Fee Receipt</option>
              <option value="marksheet">Marksheet / Academic Transcript</option>
            </optgroup>
            <optgroup label="Identity &amp; Legal">
              <option value="id_proof">National ID (Aadhaar / Passport / Voter ID)</option>
              <option value="pan_card">PAN Card</option>
            </optgroup>
            <optgroup label="Financial &amp; Income">
              <option value="income_proof">Income Certificate / Salary Slip</option>
              <option value="bank_statement">Bank Statement (3–6 Months)</option>
              <option value="guarantor_proof">Parent / Guarantor Undertaking</option>
            </optgroup>
            <optgroup label="Address Proof">
              <option value="address_proof">Address Proof (Utility Bill / Rent Agreement)</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label for="documentFile">Upload File (PDF or Image)</label>
          <input type="file" id="documentFile" accept=".jpg,.jpeg,.png,.pdf">
        </div>

        <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center; padding:10px;">Submit Request</button>
      </form>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/services/api.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/services/requestService.js"></script>
  <script src="../../js/utils/auth-guard.js"></script>
  <script src="../../js/utils/dom.js"></script>
  <script src="../../js/pages/submit-request.js"></script>
</body>
</html>
