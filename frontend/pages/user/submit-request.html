<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Loan Request — LoanFlow</title>
  <meta name="description" content="Submit a new loan request on LoanFlow.">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <div id="navbar-slot"></div>
  <div class="container" style="max-width:520px;">
    <div class="page-header">
      <h2>New Loan Request</h2>
      <a href="dashboard.html" class="btn btn--outline">← Back</a>
    </div>

    <div id="error-box" class="alert alert--error" style="display:none;"></div>

    <div class="card">
      <form id="submit-form">
        <div class="form-group">
          <label for="loanType">Loan Type</label>
          <select id="loanType">
            <option value="education">Education</option>
            <option value="skill">Skill Development</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amountRequested">Amount Requested (₹)</label>
          <input type="number" id="amountRequested" placeholder="e.g. 50000" required>
        </div>
        <div class="divider"></div>
        <p class="section-label">Document (optional)</p>
        <div class="form-group">
          <label for="docType">Document Type</label>
          <select id="docType">
            <option value="id_proof">ID Proof</option>
            <option value="income_proof">Income Proof</option>
            <option value="address_proof">Address Proof</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label for="documentFile">Upload File</label>
          <input type="file" id="documentFile" accept=".jpg,.jpeg,.png,.pdf">
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%; justify-content:center; padding:10px;">Submit Request</button>
      </form>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/services/api.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/services/requestService.js"></script>
  <script src="../../js/utils/auth-guard.js"></script>
  <script src="../../js/utils/dom.js"></script>
  <script src="../../js/pages/submit-request.js"></script>
</body>
</html>
